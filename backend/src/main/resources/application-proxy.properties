# Opt in only behind the isolated, single reverse-proxy peer; app ports must not be public.
# Properties escaping preserves regex quoting so IPv4 dots cannot act as wildcards.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=\\Q${TRUSTED_PROXY_ADDRESS:}\\E
server.tomcat.remoteip.trusted-proxies=
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.protocol-header-https-value=https
# PublicAddress owns public links/origins. Do not rewrite host/port from forwarding headers.
server.tomcat.remoteip.host-header=
server.tomcat.remoteip.port-header=
