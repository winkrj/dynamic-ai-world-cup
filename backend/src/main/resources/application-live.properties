# Explicit real-provider mode. Never combine live and dev.
worldcup.ai.api-key=${OPENAI_API_KEY:}
worldcup.ai.generation-model=${CANDIDATE_MODEL:gpt-5.6-terra}
worldcup.ai.review-model=${CANDIDATE_REVIEW_MODEL:gpt-5.6-terra}
# Explicit rollout: catalog serves curated presets or one best-effort composition call.
worldcup.ai.strategy=${CANDIDATE_ENGINE_STRATEGY:staged}
worldcup.ai.fast-timeout-seconds=${CANDIDATE_FAST_TIMEOUT_SECONDS:30}
# Database-wide cumulative allowance for this installation; 0 prevents paid calls.
worldcup.ai.budget-usd=${CANDIDATE_BUDGET_USD:0}
