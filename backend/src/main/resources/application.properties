spring.application.name=Worldcup
server.port=${SERVER_PORT:${PORT:8080}}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:55432/worldcup}
spring.datasource.username=${DATABASE_USERNAME:worldcup}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=5000
spring.flyway.clean-disabled=true
server.forward-headers-strategy=none
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.accept-float-as-int=false
worldcup.public-origin=${PUBLIC_ORIGIN:https://localhost}
worldcup.cookie-secure=true
worldcup.worker.enabled=true
worldcup.worker.poll-ms=500
worldcup.retention.enabled=true
# New accepted jobs per anonymous browser, including regeneration and later failures; resets at Seoul midnight.
worldcup.generation.daily-limit=${GENERATION_DAILY_LIMIT:2}
