plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.worldcup'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

sourceSets.test.resources.srcDir('../contracts/fixtures')

// The frontend build is an explicit input only to the combined application artifact.
// Keep backend tests, processResources and the default bootJar independent of dist.
tasks.register('appJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
	group = 'build'
	description = 'Packages the backend with the prebuilt frontend/dist web application.'
	archiveClassifier = 'app'
	mainClass = tasks.named('bootJar').flatMap { it.mainClass }
	targetJavaVersion = tasks.named('bootJar').flatMap { it.targetJavaVersion }
	classpath = sourceSets.main.runtimeClasspath
	def webDist = layout.projectDirectory.dir('../frontend/dist')
	from(webDist) {
		into 'BOOT-INF/classes/static'
		include 'index.html'
		// Only public build artifacts; omit source maps, source files and dotfiles.
		include 'assets/**/*.js', 'assets/**/*.css'
		include 'assets/**/*.png', 'assets/**/*.jpg', 'assets/**/*.jpeg', 'assets/**/*.gif'
		include 'assets/**/*.svg', 'assets/**/*.webp', 'assets/**/*.avif', 'assets/**/*.ico'
		include 'assets/**/*.woff', 'assets/**/*.woff2', 'assets/**/*.ttf', 'assets/**/*.otf'
		exclude '**/.*', '**/.*/**'
	}
	doFirst {
		if (!webDist.file('index.html').asFile.isFile()) {
			throw new GradleException('frontend/dist/index.html is missing. Run npm run build:web from the repository root before appJar.')
		}
	}
}
