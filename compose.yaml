name: dynamic-ai-world-cup
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: worldcup
      POSTGRES_USER: worldcup
      POSTGRES_PASSWORD: worldcup-local-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - worldcup-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldcup -d worldcup"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  worldcup-data:
