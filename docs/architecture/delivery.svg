<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
<title id="title">Dynamic AI World Cup · 배포 흐름</title><desc id="desc">구성한 배포 흐름. 검증한 정확한 commit을 amd64 이미지로 빌드해 private ECR digest로 고정한다. 로컬 AWS 로그인 또는 별도 승인한 GitHub OIDC를 통해 SSM으로 기존 서버에 배포한다. 잠금, 유입 차단, 진행 작업 확인, DB 백업 뒤 교체하고 외부 HTTPS를 점검한다. DB schema가 같을 때만 앱과 runtime을 되돌린다. GitHub 원격 활성화 여부는 배포 문서에서 구분한다.</desc>
<defs><marker id="1689D8" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1689D8"/></marker><marker id="47783F" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#47783F"/></marker><marker id="D97706" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#D97706"/></marker></defs>
<rect width="1600" height="860" fill="#FAF8F5"/>
<g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,Arial,sans-serif">
<text x="56" y="74" font-size="36" font-weight="700" fill="#655C54">Dynamic AI World Cup · 배포 흐름</text><text x="56" y="116" font-size="21" font-weight="400" fill="#655C54">CONFIGURED FLOW · GitHub 원격 연결은 승인 대기 / 로컬 명령과 공통 코드</text>
<rect x="56" y="250" width="250" height="174" rx="22" fill="#ffffff" stroke="#D8D1CA" stroke-width="2"/><image x="80" y="272" width="38" height="38" href="data:image/svg+xml;base64,"/><text x="80" y="346" font-size="24" font-weight="650" fill="#655C54">1. Source</text><text x="80" y="378" font-size="18" font-weight="400" fill="#655C54">정확한 remote SHA</text><text x="80" y="403" font-size="18" font-weight="400" fill="#655C54">깨끗한 작업 트리</text><rect x="364" y="250" width="250" height="174" rx="22" fill="#ffffff" stroke="#D8D1CA" stroke-width="2"/><rect x="388" y="275" width="32" height="26" rx="5" fill="none" stroke="#655C54" stroke-width="2"/><text x="388" y="346" font-size="24" font-weight="650" fill="#655C54">2. Verify</text><text x="388" y="378" font-size="18" font-weight="400" fill="#655C54">Node24 · Java21</text><text x="388" y="403" font-size="18" font-weight="400" fill="#655C54">계약·테스트·build</text><rect x="672" y="250" width="250" height="174" rx="22" fill="#ffffff" stroke="#D8D1CA" stroke-width="2"/><rect x="696" y="275" width="32" height="26" rx="5" fill="none" stroke="#655C54" stroke-width="2"/><text x="696" y="346" font-size="24" font-weight="650" fill="#655C54">3. Build → ECR</text><text x="696" y="378" font-size="18" font-weight="400" fill="#655C54">linux/amd64</text><text x="696" y="403" font-size="18" font-weight="400" fill="#655C54">immutable digest</text><rect x="980" y="250" width="250" height="174" rx="22" fill="#ffffff" stroke="#D8D1CA" stroke-width="2"/><image x="1004" y="272" width="38" height="38" href="data:image/png;base64,"/><text x="1004" y="346" font-size="24" font-weight="650" fill="#655C54">4. SSM Rollout</text><text x="1004" y="378" font-size="18" font-weight="400" fill="#655C54">기존 EC2 1대만</text><text x="1004" y="403" font-size="18" font-weight="400" fill="#655C54">lock · backup · 교체</text><rect x="1288" y="250" width="256" height="174" rx="22" fill="#ffffff" stroke="#D8D1CA" stroke-width="2"/><rect x="1312" y="275" width="32" height="26" rx="5" fill="none" stroke="#655C54" stroke-width="2"/><text x="1312" y="346" font-size="24" font-weight="650" fill="#655C54">5. HTTPS Check</text><text x="1312" y="378" font-size="18" font-weight="400" fill="#655C54">웹·API·정적 자산</text><text x="1312" y="403" font-size="18" font-weight="400" fill="#655C54">생성·유료 호출 없음</text><path d="M306 336 H356" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#D97706)"/><path d="M614 336 H664" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#D97706)"/><path d="M922 336 H972" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#D97706)"/><path d="M1230 336 H1280" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#D97706)"/><rect x="56" y="492" width="698" height="194" rx="22" fill="#FFF2E1" stroke="#D97706" stroke-width="2"/><text x="84" y="531" font-size="25" font-weight="650" fill="#655C54">인증 경계</text><text x="84" y="572" font-size="22" font-weight="400" fill="#655C54">로컬 AWS 로그인 또는 GitHub의 단기 OIDC 역할</text><text x="84" y="611" font-size="20" font-weight="400" fill="#655C54">GitHub 실행은 main + production 환경만 허용</text><text x="84" y="651" font-size="19" font-weight="400" fill="#655C54">운영 OpenAI / DB 키는 서버에 유지 · CI로 복사하지 않음</text><rect x="802" y="492" width="742" height="194" rx="22" fill="#EEF4E9" stroke="#A9BE9F" stroke-width="2"/><text x="830" y="531" font-size="25" font-weight="650" fill="#655C54">배포 보호와 복구</text><text x="830" y="572" font-size="21" font-weight="400" fill="#655C54">새 접수 일시 차단 → 진행 작업 확인 → DB 백업 → 교체</text><text x="830" y="611" font-size="20" font-weight="400" fill="#655C54">실패 시 schema가 같은 경우만 이전 앱/runtime 복귀</text><text x="830" y="651" font-size="19" font-weight="400" fill="#655C54">DB 자동 복원·장부 초기화 없음 · 변경 schema는 사람 확인</text><text x="56" y="758" font-size="21" font-weight="600" fill="#655C54">GitHub 수동 버튼과 로컬 명령은 같은 배포 코드를 사용합니다. 상시 자동배포·무중단 배포는 아닙니다.</text></g></svg>
